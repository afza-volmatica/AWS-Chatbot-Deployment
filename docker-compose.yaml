services:

  backend:
    build:
      context: ./backend
    container_name: chatbot-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: chatbot-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000/chat
    depends_on:
      - backend
    restart: unless-stopped